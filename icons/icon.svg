<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="portalOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  
  <!-- Left ManaBox Source Card -->
  <rect x="20" y="32" width="42" height="64" rx="6" fill="url(#mb)" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.95"/>
  <rect x="26" y="38" width="30" height="20" rx="3" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="41" cy="74" r="7" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Right Archidekt Portal Frame (Gateway) -->
  <rect x="66" y="32" width="42" height="64" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="url(#portalOrange)" stroke-width="5" stroke-dasharray="14 6"/>
  <rect x="72" y="38" width="30" height="52" rx="4" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Laser / Energy Beam & Lock-in Arrowhead -->
  <path d="M 40 64 L 84 64" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M 40 64 L 84 64" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <polygon points="96,64 78,52 82,64 78,76" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
</svg>